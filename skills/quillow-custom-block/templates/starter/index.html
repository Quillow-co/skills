<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1"
    />
    <title>Custom block starter</title>
    <link
      rel="stylesheet"
      href="./style.css"
    />
    <script
      type="module"
      src="./app.mjs"
    ></script>
  </head>
  <body>
    <main class="block">
      <header class="block-intro">
        <h1>Your custom block</h1>
        <p>Replace the starter with the user's content and visual direction.</p>
      </header>

      <section
        class="block-content"
        aria-labelledby="content-title"
      >
        <div class="block-copy">
          <h2 id="content-title">Primary content</h2>
          <p>Prioritize one clear idea and adapt it for each Quillow size.</p>
        </div>

        <div class="block-action">
          <button
            id="action"
            type="button"
            aria-pressed="false"
          >
            Try action
          </button>
          <p
            id="status"
            role="status"
            aria-live="polite"
          ></p>
        </div>
      </section>

      <noscript>This block needs JavaScript enabled.</noscript>
    </main>
  </body>
</html>
