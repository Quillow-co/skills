<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1"
    />
    <title>Consultation calculator</title>
    <link
      rel="stylesheet"
      href="./style.css"
    />
    <script
      type="module"
      src="./app.mjs"
    ></script>
  </head>
  <body>
    <main
      class="calculator"
      aria-labelledby="heading"
    >
      <p class="eyebrow">Plan your next step</p>
      <h1 id="heading">Consultation calculator</h1>
      <p class="intro">Estimate your sessions at $120 per hour.</p>
      <div class="fields">
        <label
          >Session length
          <select id="duration">
            <option value="30">30 minutes</option>
            <option
              value="60"
              selected
            >
              60 minutes
            </option>
            <option value="90">90 minutes</option>
          </select>
        </label>
        <label
          >Number of sessions
          <input
            id="sessions"
            type="number"
            min="1"
            max="100"
            step="1"
            value="1"
            aria-describedby="hint error"
          />
        </label>
      </div>
      <p
        id="hint"
        class="hint"
      >
        Choose between 1 and 100 sessions.
      </p>
      <p
        id="error"
        class="error"
        role="status"
      ></p>
      <div
        class="result"
        aria-live="polite"
        aria-atomic="true"
      >
        <span>Estimated total</span>
        <output
          id="total"
          for="duration sessions"
          >$120.00</output
        >
      </div>
      <noscript>This calculator needs JavaScript enabled.</noscript>
    </main>
  </body>
</html>
